<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Past Continuous Battle 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:Fkburger;src:local('Fkburger'),local('FK Burger')}
:root{--ink:#4a3f6b;--panel:#ffffffe6;--bg:linear-gradient(160deg,#ffe3ef,#dff0ff 55%,#e6ffe9);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#f3ecff;--panel:#3b3358e6;--bg:linear-gradient(160deg,#2f2748,#2a3350 55%,#273b3a)}}
:root[data-theme=dark]{--ink:#f3ecff;--panel:#3b3358e6;--bg:linear-gradient(160deg,#2f2748,#2a3350 55%,#273b3a)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Fkburger,Mali,Tahoma,sans-serif;font-weight:700;overflow-x:hidden}
*{box-sizing:border-box}[hidden]{display:none!important}
#app{max-width:760px;margin:0 auto;padding:12px;min-height:100%}
.card{background:var(--panel);border-radius:24px;padding:16px;border:3px solid #fff;box-shadow:0 8px 0 rgba(140,120,190,.28)}
button{font:inherit;color:#4a3f6b;border:0;border-radius:18px;padding:12px 18px;cursor:pointer;background:#ffb3d1;box-shadow:0 6px 0 #e08fb2;transition:transform .1s,box-shadow .1s;font-size:16px}
button:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #e08fb2}
button:disabled{opacity:.5;cursor:not-allowed}
.b2{background:#b8f0d8;box-shadow:0 6px 0 #86cdb0}.b3{background:#b9dcff;box-shadow:0 6px 0 #86b4e0}.b4{background:#fff3b0;box-shadow:0 6px 0 #d8c874}
#mu{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:20;padding:8px 12px}
h1{margin:6px 0;font-size:clamp(26px,6vw,40px);text-align:center;text-shadow:3px 3px 0 #ffb3d1}
input{font:inherit;width:100%;padding:14px;border-radius:16px;border:3px solid #d9c9ff;background:#fff;color:#4a3f6b;font-size:18px;text-align:center}
.c{text-align:center}.warn{color:#d6456f;min-height:24px}
#sm .pl{position:relative;height:340px;margin:10px 0;border-radius:24px;background:linear-gradient(#bfe6ff,#e4f7d4 55%,#c9f0d8);overflow:hidden;perspective:700px;border:4px solid #fff}
#mp{position:absolute;inset:0;transform:rotateX(22deg);transform-origin:bottom}
#mp svg{position:absolute;inset:0;width:100%;height:100%}
.nd{position:absolute;font-size:44px;transform:translate(-50%,-50%);text-align:center;line-height:1}
.nd small{display:block;font-size:12px}
#mh{position:absolute;font-size:46px;transform:translate(-50%,-80%);transition:left 1.6s linear,top 1.6s linear;animation:bob .5s infinite alternate}
@keyframes bob{to{margin-top:-8px}}
#ar{position:relative;height:300px;border-radius:24px;overflow:hidden;perspective:800px;border:4px solid #fff;box-shadow:0 8px 0 rgba(140,120,190,.28)}
#bg{position:absolute;inset:0}#bg span{position:absolute;opacity:.9}
#fl{position:absolute;left:-30%;right:-30%;bottom:-30px;height:170px;transform:rotateX(62deg);transform-origin:bottom;background:repeating-conic-gradient(#ffffff66 0 25%,#ffffff22 0 50%) 0 0/64px 64px}
#s3{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(6deg) rotateY(-8deg)}
.ch{position:absolute;bottom:48px;text-align:center;width:120px;transform-style:preserve-3d}
#hero{left:8%}#en{right:8%}
.em{font-size:72px;line-height:1;animation:bob .7s infinite alternate ease-in-out;filter:drop-shadow(0 8px 4px #0003);position:relative}
#hw{position:absolute;right:-6px;bottom:6px;font-size:32px}
.sh{position:absolute;left:20px;right:20px;bottom:-12px;height:14px;border-radius:50%;background:#0003}
.nm{font-size:13px;background:#fff;color:#4a3f6b;border-radius:10px;padding:1px 8px;display:inline-block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{height:10px;background:#fff;border-radius:6px;margin:3px 10px;overflow:hidden;border:2px solid #fff}.hb i{display:block;height:100%;background:#ff8fb3;transition:width .5s}.hb.g i{background:#7fe0b0}
.hit{animation:sk .5s}.hurt{animation:sk .5s}
.hit .em{filter:brightness(2) drop-shadow(0 0 10px #fff)}.hurt .em{filter:sepia(1) saturate(6) hue-rotate(-30deg)}
@keyframes sk{20%{margin-left:-14px}40%{margin-left:14px}60%{margin-left:-10px}80%{margin-left:8px}}
.pr{position:absolute;font-size:34px;z-index:5;transform:translate(-50%,-50%)}
.ft{position:absolute;z-index:6;font-size:26px;color:#fff;text-shadow:2px 2px 0 #e0447a,-2px -2px 0 #e0447a;transform:translate(-50%,-50%);pointer-events:none}
#fgt{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;color:#fff;text-shadow:4px 4px 0 #e0447a;z-index:7;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0 8px;font-size:14px;padding-right:110px;flex-wrap:wrap}
.dots i{display:inline-block;width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid #d9c9ff;margin-right:4px}.dots .ok{background:#7fe0b0}.dots .no{background:#ff8fb3}.dots .cur{background:#fff3b0}
#qa{margin-top:12px}.q{font-size:clamp(18px,4.5vw,24px);margin:6px 0 12px}.bl{color:#d6456f;border-bottom:3px dashed #d6456f}
.ty{display:inline-block;background:#d9c9ff;color:#4a3f6b;border-radius:12px;padding:2px 12px;font-size:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op{background:#fff;box-shadow:0 5px 0 #d9c9ff;text-align:left;padding:12px}.op i{background:#d9c9ff;border-radius:8px;padding:0 7px;margin-right:8px;font-style:normal}
.wr{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.wd,.tk{background:#fff;box-shadow:0 4px 0 #d9c9ff;padding:8px 12px}
.bx{min-height:52px;border:3px dashed #d9c9ff;border-radius:16px;padding:6px;display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.good{background:#b8f0d8!important;box-shadow:0 5px 0 #86cdb0!important}.bad{background:#ffc2d4!important;box-shadow:0 5px 0 #e08fb2!important}
#fb{margin-top:12px;background:#fff9d6;color:#4a3f6b;border-radius:16px;padding:12px;font-weight:500}
#ov{position:fixed;inset:0;background:#4a3f6b99;display:grid;place-items:center;padding:16px;z-index:30}#ov .card{max-width:420px;width:100%;text-align:center}
#ov .big{font-size:60px}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
table{width:100%;border-collapse:collapse}td{padding:6px;border-bottom:2px solid #d9c9ff55}
@media(max-width:520px){.g{grid-template-columns:1fr}.em{font-size:56px}.ch{width:96px}#ar{height:260px}}
.em svg{width:104px;height:104px;overflow:visible}.em{transform:translateZ(50px)}#mh svg{width:52px}
#pz{position:fixed;right:64px;top:calc(10px + env(safe-area-inset-top,0px));z-index:20;padding:8px 12px}input[type=range]{padding:0;border:0;background:none}
.sl{position:absolute;width:96px;height:96px;border:9px solid #fff;border-right-color:transparent;border-bottom-color:transparent;border-radius:50%;z-index:6;filter:drop-shadow(0 0 8px #fff)}.rg{position:absolute;width:40px;height:40px;border:5px solid #fff;border-radius:50%;z-index:6}
.tele .em{filter:drop-shadow(0 0 16px #ff4d6d) brightness(1.15)}.frz{filter:contrast(1.35) saturate(1.5)}
.fa{left:-10%;font-size:26px;animation:fa 5s linear infinite}.f2{animation-duration:7s;animation-delay:2s}.f3{animation-duration:4s;animation-delay:1s}@keyframes fa{to{left:110%}}
.arm{transform-origin:70px 62px;animation:ia 1s infinite alternate ease-in-out}@keyframes ia{to{transform:rotate(-14deg)}}
.swing .arm{animation:sw .5s}@keyframes sw{0%{transform:rotate(0)}30%{transform:rotate(-95deg)}65%{transform:rotate(80deg)}100%{transform:rotate(0)}}
.lg{transform-box:fill-box;transform-origin:50% 0}.walk .lg.l{animation:wl .17s infinite alternate}.walk .lg.r{animation:wl .17s infinite alternate-reverse}@keyframes wl{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.wg{transform-box:fill-box;transform-origin:50% 100%;animation:fl .35s infinite alternate ease-in-out}@keyframes fl{to{transform:scaleY(.55) rotate(10deg)}}
.ey{transform-box:fill-box;transform-origin:center;animation:bk 3.5s infinite}@keyframes bk{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}.card{transform:perspective(900px) rotateX(2deg)}#s3{transition:transform .2s}
@media(max-width:520px){.em svg{width:80px;height:80px}}
@media(prefers-reduced-motion:reduce){.em,#mh,.arm,.wg,.ey,.lg,.fa{animation:none!important}}
</style></head><body><div id="app">
<button id="mu" class="b4" aria-label="ปิดเสียง">🔊</button><button id="pz" class="b3" aria-label="พักเกม">⏸</button>

<section id="sn" class="card c">
<h1>⚔️ Past Continuous<br>Battle 3D</h1>
<p>🦸 ผู้กล้าแห่งไวยากรณ์ ออกเดินทางไปปราบจอมวายร้าย 3 ด่าน!</p>
<input id="nm" list="dl" maxlength="30" placeholder="พิมพ์ชื่อนักเรียน" autocomplete="off"><datalist id="dl"></datalist>
<p class="warn" id="wn"></p>
<button id="go" class="b2">▶ เริ่มเกม</button>
</section>

<section id="sm" class="card c" hidden>
<h1 id="mt">แผนที่ผจญภัย</h1>
<div class="pl"><div id="mp"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline id="pl" fill="none" stroke="#fff" stroke-width="2.4" stroke-dasharray="4 3" stroke-linecap="round"/></svg><div id="nds"></div><div id="mh">🦸</div></div></div>
<button id="wk" class="b3">👣 เดินไปด่านถัดไป</button>
</section>

<section id="sb" hidden>
<div class="top"><span id="tt"></span><span class="dots" id="dt"></span><span id="sc"></span></div>
<div id="ar"><div id="bg"></div><div id="fl"></div><button id="dg" class="b3" hidden style="position:absolute;left:50%;bottom:8px;transform:translateX(-50%);z-index:9">💨 หลบ!</button>
<div id="s3">
<div class="ch" id="hero"><span class="nm" id="hn"></span><div class="hb g"><i id="hh" style="width:100%"></i></div><div class="em"><span id="hw"></span></div><div class="sh"></div></div>
<div class="ch" id="en"><span class="nm" id="en_n"></span><div class="hb"><i id="eh" style="width:100%"></i></div><div class="em" id="ee"></div><div class="sh"></div></div>
</div></div>
<div class="card" id="qa-card" style="margin-top:12px"><span class="ty" id="ty"></span><div id="qa"></div><div id="fb" hidden></div></div>
</section>

<section id="se" class="card c" hidden></section>
<div id="ov" hidden></div>
</div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K=matchMedia('(prefers-reduced-motion:reduce)').matches?.35:1;
/* ===== เสียง ===== */
let AC,mute=false;
function ctx(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();return AC}
function tone(f1,f2,d,ty,v,dl=0,m=SV){v*=m;const a=ctx(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+dl;o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}
function noise(d,v,fr,dl=0){v*=SV;const a=ctx(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),t=a.currentTime+dl;s.buffer=b;f.type='lowpass';f.frequency.value=fr;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f).connect(g).connect(a.destination);s.start(t)}
function snd(k){if(mute)return;try{
if(k=='ok'){noise(.15,.6,6000);tone(1400,2600,.18,'square',.12);tone(900,1800,.25,'triangle',.12,.07);tone(220,110,.2,'sawtooth',.2,.05);tone(2200,2200,.3,'triangle',.1,.12);tone(660,660,.12,'square',.1,.2);tone(880,880,.25,'square',.1,.32)}
if(k=='bad'){noise(.6,.9,500);tone(150,35,.6,'sawtooth',.35);tone(90,30,.5,'square',.2,.1);noise(.9,1,250,.05);tone(70,22,.9,'sine',.7);tone(500,180,.5,'triangle',.2,.25)}
if(k=='step')tone(300,200,.08,'triangle',.15);
if(k=='click')tone(700,900,.07,'sine',.15);
if(k=='fight'){[0,.22,.44].forEach(d=>{tone(130,40,.2,'sine',.6,d);noise(.1,.3,800,d)});tone(330,330,.25,'sawtooth',.14,.7);tone(440,440,.5,'sawtooth',.14,.95)}
if(k=='win')[523,659,784,1047].forEach((f,i)=>tone(f,f*1.01,.25,'triangle',.2,i*.14));
if(k=='lose')[392,330,262,196].forEach((f,i)=>tone(f,f*.98,.3,'sawtooth',.15,i*.2));
}catch(e){}}
$('#mu').onclick=()=>{mute=!mute;$('#mu').textContent=mute?'🔇':'🔊'};
/* ===== ข้อมูล ===== */
const E=[{n:'ก็อบลิน',e:'👺',a:'🗡️',t:'ทุ่งหญ้าสงคราม',bg:'linear-gradient(#bfe6ff,#e4f7d4 70%)',d:['🏰','⛰️','🚩','☁️','⚔️','🍄','🗡️']},
{n:'ราชาผีดิบ',e:'💀',a:'💀',t:'สุสานแห่งเงา',bg:'linear-gradient(#cdbdf5,#f1d6f0 70%)',d:['🌙','🪦','🚩','🦇','🛡️','🏛️','🗡️']},
{n:'มังกร',e:'🐉',a:'🔥',t:'ภูเขาไฟเดือด',bg:'linear-gradient(#ffd3b8,#fff1c9 70%)',d:['🌋','🏯','🚩','☁️','⚔️','💎','🪨']}];
const W=[{n:'ไม้เท้า',e:'🪄',p:'✨'},{n:'ดาบ',e:'🗡️',p:'🗡️',s:1},{n:'ธนู',e:'🏹',p:'➳'},{n:'ค้อนทอง',e:'🔨',p:'🔨',s:1}];
const G=(b)=>`<svg viewBox="0 0 100 100"><g stroke="#4a3f6b" stroke-width="3" stroke-linejoin="round">${b}</g></svg>`;
const EY=(y,r=4.5)=>`<circle class="ey" cx="40" cy="${y}" r="${r}" fill="#4a3f6b"/><circle class="ey" cx="60" cy="${y}" r="${r}" fill="#4a3f6b"/><circle cx="41.5" cy="${y-1.5}" r="1.5" fill="#fff" stroke="none"/><circle cx="61.5" cy="${y-1.5}" r="1.5" fill="#fff" stroke="none"/>`;
const HERO=G(`<rect class="lg l" x="36" y="84" width="10" height="15" rx="5" fill="#ffe0c8"/><rect class="lg r" x="54" y="84" width="10" height="15" rx="5" fill="#ffe0c8"/><path d="M22 60Q50 100 78 60L70 92H30Z" fill="#ffb3d1"/><rect x="32" y="58" width="36" height="30" rx="14" fill="#b8f0d8"/><circle cx="50" cy="38" r="26" fill="#ffe0c8"/><path d="M24 38Q22 8 50 10Q78 8 76 38Q60 22 24 38Z" fill="#ff9ec4"/>${EY(44)}<circle cx="31" cy="52" r="4" fill="#ffb3b3" stroke="none"/><circle cx="69" cy="52" r="4" fill="#ffb3b3" stroke="none"/><path d="M45 54Q50 59 55 54" fill="none" stroke-linecap="round"/><path class="arm" d="M68 62L86 52" stroke="#ffe0c8" stroke-width="10" stroke-linecap="round"/>`);
const CH=[G(`<path d="M18 40L2 26L22 58ZM82 40L98 26L78 58Z" fill="#a8e6a3"/><rect x="28" y="62" width="44" height="28" rx="14" fill="#d8b48a"/><circle cx="50" cy="42" r="30" fill="#a8e6a3"/><path d="M32 32L46 39M68 32L54 39" stroke-width="4" stroke-linecap="round"/>${EY(46)}<path d="M38 58Q50 52 62 58Z" fill="#fff"/>`),
G(`<rect x="30" y="62" width="40" height="28" rx="12" fill="#d9c9ff"/><circle cx="50" cy="44" r="28" fill="#fff"/><path d="M26 24L30 6L41 19L50 4L59 19L70 6L74 24Z" fill="#ffe27a"/><circle cx="39" cy="46" r="7" fill="#4a3f6b"/><circle cx="61" cy="46" r="7" fill="#4a3f6b"/><path d="M50 54L46 60H54Z" fill="#4a3f6b"/><path d="M36 66L42 62L48 66L54 62L60 66L66 62" fill="none"/>`),
G(`<path class="wg" d="M16 52Q0 16 26 20Q30 38 32 54ZM84 52Q100 16 74 20Q70 38 68 54Z" fill="#b9dcff"/><ellipse cx="50" cy="68" rx="30" ry="24" fill="#ffb3d1"/><ellipse cx="50" cy="72" rx="18" ry="16" fill="#fff3b0"/><path d="M30 22L34 4L44 18ZM70 22L66 4L56 18Z" fill="#fff3b0"/><circle cx="50" cy="40" r="26" fill="#ffb3d1"/>${EY(40,5)}<circle cx="45" cy="52" r="2" fill="#4a3f6b"/><circle cx="55" cy="52" r="2" fill="#4a3f6b"/><path d="M42 58Q50 52 58 58" fill="none" stroke-linecap="round"/>`)];
const MS=['ภารกิจ: ปราบก็อบลินจอมขโมย','ภารกิจ: ส่งราชาผีดิบกลับสุสาน','ภารกิจ: หยุดมังกรพ่นไฟ'];
const TY={t:'⌨️ พิมพ์คำตอบ',m:'🔗 จับคู่',c:'🎯 เลือกคำตอบ',f:'✏️ เติมคำในช่องว่าง',e:'🔍 จับผิด (Error)',o:'🧩 เรียงประโยคใหม่'};
const QS=[[
{t:'c',q:'She ___ a book at 8 pm yesterday.',o:['was reading','were reading','reads','is reading'],a:0,x:'she เป็นเอกพจน์ จึงใช้ was + V-ing (was reading) เพราะเป็นเหตุการณ์ที่กำลังเกิดขึ้น ณ เวลานั้นในอดีต'},
{t:'f',q:'They ___ football in the park.',o:['were playing','was playing','played','playing'],a:0,x:'they เป็นพหูพจน์ ใช้ were + V-ing และต้องมี were ไม่ใช่ V-ing ลอย ๆ'},
{t:'e',w:['We','was','watching','TV','at','nine.'],a:1,fix:'were',x:'We เป็นพหูพจน์ ต้องใช้ were watching ไม่ใช่ was watching'},
{t:'o',w:['My','mother','was','cooking','dinner.'],x:'โครงสร้าง: Subject + was/were + V-ing + กรรม'},
{t:'c',q:'The kids ___ in the garden.',o:['were running','was running','ran','are running'],a:0,x:'the kids เป็นพหูพจน์ในอดีตต่อเนื่อง จึงใช้ were running'},
{t:'f',q:'My dad ___ the car at six.',o:['was washing','were washing','washed','washing'],a:0,x:'my dad = he ใช้ was + V-ing เพื่อบอกว่ากำลังทำอยู่ ณ เวลานั้น'},
{t:'e',w:['You','was','singing','loudly','last','night.'],a:1,fix:'were',x:'You ใช้ were เสมอ จึงเป็น You were singing'},
{t:'o',w:['The','birds','were','singing','outside.'],x:'the birds เป็นพหูพจน์ จึงใช้ were + V-ing'},
{t:'t',q:'We ___ (watch) TV at nine.',a:['were watching'],x:'we ใช้ were + V-ing'},
{t:'m',p:[['I','was'],['They','were'],['She','was'],['We','were']],x:'I/he/she/it ใช้ was ส่วน you/we/they ใช้ were'}],
[
{t:'c',q:'___ you sleeping at 10 pm last night?',o:['Were','Was','Did','Are'],a:0,x:'ประโยคคำถาม Past Continuous ย้าย was/were ขึ้นหน้าประธาน และ you ใช้ were'},
{t:'f',q:'He ___ listening to the teacher.',o:['wasn’t','weren’t','didn’t','not'],a:0,x:'ปฏิเสธใช้ was/were + not โดย he ใช้ wasn’t (ไม่ใช้ didn’t กับ V-ing)'},
{t:'e',w:['What','was','she','do','at','that','time?'],a:3,fix:'doing',x:'หลัง was she ต้องเป็น V-ing คือ What was she doing?'},
